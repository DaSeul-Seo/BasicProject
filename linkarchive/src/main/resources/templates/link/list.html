<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <title>Link Archive</title>
        <script th:src="@{/js/bootstrap.min.js}"></script>
        <script th:src="@{/js/link.js}"></script>
        <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}">
        <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    </head>

    <body>
        <!-- 수정 성공 메시지 -->
        <div id="toast-container"
            class="toast-container position-fixed top-0 end-0 p-3"
            style="z-index:9999;">
        </div>
        <script th:inline="javascript">
            document.addEventListener("DOMContentLoaded", function () {
                const successMessage = /*[[${successMessage}]]*/ null;

                if (successMessage) {
                    showToast(successMessage);
                }
            });
        </script>
        <!-- 에러 메시지 -->
        <!-- <div th:if="${errorMessage}"
            class="alert alert-danger">
            <span th:text="${errorMessage}"></span>
        </div> -->
        <div class="container mt-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-4">Link Archive</h2>
                    <small>로그인 : 
                        <!-- <strong th:text="${#authentication.name}"></strong> -->
                        <strong th:text="${loginUser}"></strong>
                        <a th:href="@{/mypage}" class="btn btn-outline-secondary btn-sm">마이페이지</a>
                    </small>
                </div>

                <form th:action="@{/logout}" method="post">
                    <input type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-danger">로그아웃</button>
                </form>
            </div>

            <div class="card mb-4">
                <div class="mb-3">
                    <a th:href="@{/links(keyword=${keyword}, filter=${filter}, sort=${sort})}" class="btn btn-secondary">전체</a>
                    <!-- <a href="/links/favorites" class="btn btn-warning">★ 즐겨찾기</a> -->
                    <a th:each="category : ${categories}"
                        th:href="@{/links(categoryId=${category.id}, keyword=${keyword}, filter=${filter}, sort=${sort})}"
                        th:classappend="${categoryId == category.id} ? 'btn btn-primary' : 'btn btn-outline-primary'"
                        style="margin-right: 5px;"
                        >[[${category.name}]]</a>
                </div>
                <div class="card-header">URL 저장</div>
                <div class="card-body">
                    <form action="/links" method="post" class="row g-2">
                        <div class="col-md-7">
                            <p>URL <input type="text" name="url" class="form-control" placeholder="https://"></p>
                            <p>태그 <input type="text" name="tags" class="form-control" placeholder="spring,jps,security"></p>
                            <p>메모 <textarea rows="3" name="memo" class="form-control"></textarea></p>
                            <input type="hidden"
                                    th:name="${_csrf.parameterName}"
                                    th:value="${_csrf.token}">
                        </div>
                        <div class="col-md-3">
                            <p>카테고리
                                <select name="categoryId" class="form-select">
                                    <option value="">카테고리 선택</option>
                                    <option th:each="category : ${categories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}"></option>
                                </select>
                            </p>
                        </div>
                        <div class="col-md-2">
                            <p style="padding-top: 26px">
                                <button type="submit" class="btn btn-primary w-100">저장</button>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
            <!-- 태그 목록 -->
            <div class="mb-3">
                <h2>태그 목록</h2>
                <a th:each="tag : ${tags}"
                    th:href="@{/links(categoryId=${categoryId}, keyword=${tag.name}, filter=${filter}, sort=${sort})}"
                    class="badge bg-secondary me-1 mb-1">
                    #<span th:text="${tag.name}"></span>
                    (<span th:text="${tag.count}"></span>)
                </a>
            </div>
            <!-- 검색 -->
            <div class="card mb-4">
                <div class="card-header">검색</div>
                <div class="card-body">
                    <!-- <form action="/links/search" method="get" class="row g-2"> -->
                    <form action="/links" method="get" class="row g-2">
                        <input type="hidden" name="categoryId" th:value="${categoryId}">
                        <div class="col-md-10">
                            <input type="text" 
                                    name="keyword" 
                                    class="form-control"
                                    placeholder="검색어"
                                    th:value="${keyword}">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-success w-100">검색</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="btn-group mb-3">
                <a th:href="@{/links(filter='all', page=0, keyword=${keyword}, sort=${sort}, categoryId=${categoryId})}"
                    class="btn"
                    th:classappend="${filter  == 'all'} ? 'active'">전체</a>
                <a th:href="@{/links(filter='favorite', page=0, keyword=${keyword}, sort=${sort}, categoryId=${categoryId})}"
                    class="btn"
                    th:classappend="${filter  == 'favorite'} ? 'active'">즐겨찾기</a>
                <a th:href="@{/links(filter='unread', page=0, keyword=${keyword}, sort=${sort}, categoryId=${categoryId})}"
                    class="btn"
                    th:classappend="${filter  == 'unread'} ? 'active'">안읽음</a>
            </div>
            <div class="stats-bar mb-3">
                <span>전체 <strong th:text="${totalCount}"></strong></span>
                <span>즐겨찾기 <strong th:text="${favoriteCount}"></strong></span>
                <span>읽음 <strong th:text="${readCount}"></strong></span>
                <span>안읽음 <strong th:text="${unreadCount}"></strong></span>
            </div>
            <!-- <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5>전체</h5>
                            <h2 th:text="${totalCount}"></h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5>즐겨찾기</h5>
                            <h2 th:text="${favoriteCount}"></h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5>읽음</h5>
                            <h2 th:text="${readCount}"></h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5>안읽음</h5>
                            <h2 th:text="${unreadCount}"></h2>
                        </div>
                    </div>
                </div>
            </div> -->
            <div th:if="${links.isEmpty()}"
                class="alert alert-warning">
                저장된 링크가 없습니다.
            </div>
            <!-- 목록 -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">목록</h5>
                    <form id="sortForm" method="get" action="/links">
                        <input type="hidden" name="keyword" th:value="${keyword}">
                        <input type="hidden" name="filter" th:value="${filter}">
                        <input type="hidden" name="categoryId" th:value="${categoryId}">

                        <select name="sort" class="form-select" style="width: 150px;" onchange="this.form.submit()">
                            <option value="latest" th:selected="${sort == 'latest'}">최신순</option>
                            <option value="oldest" th:selected="${sort == 'oldest'}">오래된순</option>
                            <option value="favorite" th:selected="${sort == 'favorite'}">즐겨찾기순</option>
                        </select>
                    </form>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-4"
                            th:each="link : ${links.content}">
                            <div class="card h-100 shadow-sm link-card"
                                th:attr="data-url=${link.url},
                                        data-id=${link.id},
                                        data-read=${link.readAt != null},
                                        data-link-id=${link.id}"
                                th:classappend="
                                    (${link.favorite} ? ' favorite-card' : '') +
                                    (${link.readAt != null} ? ' opacity-50' : '')">
                                <!-- 썸네일 -->
                                <img th:if="${link.thumbnail != null && !#strings.isEmpty(link.thumbnail)
                                            ? link.thumbnail : '/img/no-image.png'}"
                                    th:src="${link.thumbnail}"
                                    class="card-img-top"
                                    style="height: 200px; object-fit:cover;">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <!-- 카테고리 -->
                                        <span class="badge bg-primary"
                                            th:text="${link.category != null ? link.category.name : '미분류'}"></span>
                                        <!-- 즐겨찾기 -->
                                        <form th:action="@{/links/{id}/favorite(id=${link.id})}" method="post"
                                                style="opacity: 1 !important;">
                                            <input type="hidden"
                                                    th:name="${_csrf.parameterName}"
                                                    th:value="${_csrf.token}">
                                            <input type="hidden" name="keyword" th:value="${keyword}">
                                            <input type="hidden" name="page" th:value="${links.number}">
                                            <input type="hidden" name="filter" th:value="${filter}">
                                            <input type="hidden" name="sort" th:value="${sort}">
                                            <input type="hidden" name="categoryId" th:value="${categoryId}">
    
                                            <button class="btn btn-sm favorite-btn"
                                                    type="button"
                                                    th:data-id="${link.id}"
                                                    th:data-favorite="${link.favorite}">
                                                <span th:text="${link.favorite ? '★' : '☆'}"
                                                    class="favorite-star"></span>
                                                <!-- <span th:if="${link.favorite}">★</span>
                                                <span th:unless="${link.favorite}">☆</span> -->
                                            </button>
                                        </form>
                                    </div>
                                    <!-- 제목 -->
                                    <h5 class="card-title"
                                        th:text="${link.title}"></h5>
                                    <!-- 태그 -->
                                    <div class="tag-list">
                                        <a th:each="linkTag : ${link.linkTags}"
                                              th:href="@{/links(keyword=${linkTag.tag.name}, filter=${filter}, sort=${sort}, categoryId=${categoryId})}"
                                              class="badge bg-light text-dark me-1">
                                              #<span th:text="${linkTag.tag.name}"></span>
                                        </a>
                                    </div>
                                    <!-- URL -->
                                    <!-- <p>
                                        <a th:href="${link.url}"
                                            target="_blank"
                                            class="text-decoration-none">방문하기</a>
                                    </p> -->
                                    <!-- 설명 -->
                                    <p class="text-muted"
                                        th:text="${link.description != null && #strings.length(link.description) > 100
                                                    ? #strings.substring(link.description, 0, 100) + '...'
                                                    : link.description}"></p>
                                    <!-- 메모 -->
                                    <div th:if="${link.memo != null && !#strings.isEmpty(link.memo)}" class="mt-2">
                                        <small class="text-primary">
                                            메모 : <span th:text="${link.memo}"></span>
                                        </small>
                                    </div>
                                    <!-- 등록일, 수정일 -->
                                    <small class="text-secondary">등록일 : 
                                        <span th:text="${#temporals.format(link.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                    </small>
                                    <small class="text-secondary">수정일 : 
                                        <span th:text="${#temporals.format(link.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
                                    </small>
                                </div>
                                <div class="card-footer bg-white">
                                    <div class="d-flex justify-content-between">
                                        <!-- 즐겨찾기 -->
                                        <!-- <form th:action="@{/links/{id}/favorite(id=${link.id})}" method="post">
                                            <input type="hidden"
                                                    th:name="${_csrf.parameterName}"
                                                    th:value="${_csrf.token}">
                                            <input type="hidden" name="keyword" th:value="${keyword}">
                                            <input type="hidden" name="page" th:value="${links.number}">
                                            <input type="hidden" name="filter" th:value="${filter}">
                                            <input type="hidden" name="sort" th:value="${sort}">
                                            <input type="hidden" name="categoryId" th:value="${categoryId}">
                                            <button class="btn btn-sm favorite-btn">
                                                <span th:text="${link.favorite ? '★' : '☆'}"></span>
                                            </button>
                                        </form> -->
                                        <!-- 읽음 -->
                                        <form th:action="@{/links/{id}/read(id=${link.id})}" method="post">
                                            <input type="hidden"
                                                    th:name="${_csrf.parameterName}"
                                                    th:value="${_csrf.token}">
                                            <input type="hidden" name="keyword" th:value="${keyword}">
                                            <input type="hidden" name="page" th:value="${links.number}">
                                            <input type="hidden" name="filter" th:value="${filter}">
                                            <input type="hidden" name="sort" th:value="${sort}">
                                            <input type="hidden" name="categoryId" th:value="${categoryId}">
                                            
                                            <button class="btn btn-sm">
                                                <span class="badge read-badge"
                                                        th:classappend="${link.readAt != null} ? ' bg-success' : ' bg-danger'"
                                                        th:text="${link.readAt != null} ? '읽음' : '안읽음'">

                                                </span>
                                                <!-- <span th:if="${link.readAt != null}" class="badge bg-success">읽음</span>
                                                <span th:unless="${link.readAt != null}" class="badge bg-danger">안읽음</span> -->
                                            </button>
                                        </form>
                                        <!-- 삭제 -->
                                         <form th:action="@{/links/{id}/delete(id=${link.id})}" method="post">
                                            <input type="hidden"
                                                    th:name="${_csrf.parameterName}"
                                                    th:value="${_csrf.token}">
                                            <input type="hidden" name="keyword" th:value="${keyword}">
                                            <input type="hidden" name="page" th:value="${links.number}">
                                            <input type="hidden" name="filter" th:value="${filter}">
                                            <input type="hidden" name="sort" th:value="${sort}">
                                            <input type="hidden" name="categoryId" th:value="${categoryId}">

                                            <a th:href="@{/links/{id}/edit(id=${link.id},
                                                                        page=${links.number},
                                                                        keyword=${keyword},
                                                                        filter=${filter},
                                                                        sort=${sort},
                                                                        categoryId=${categoryId})}"
                                                class="btn btn-sm btn-outline-primary">수정</a>
                                            <!-- submit이면 AJAX 전에 form이 날아가 버린다. -->
                                            <button type="button" class="btn btn-sm btn-outline-danger delete-btn" th:data-id="${link.id}">삭제</button>
                                         </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 페이지네이션 -->
                    <nav class="mt-4">
                        <ul class="pagination justify-content-center">
                            <!-- 처음 -->
                            <li class="page-item" th:if="${!links.first}">
                                <a class="page-link"
                                    th:href="@{/links(page=0, keyword=${keyword}, filter=${filter}, sort=${sort}, categoryId = ${categoryId})}">
                                    <<
                                </a>
                            </li>
                            <!-- 이전 -->
                            <li class="page-item" th:if="${links.hasPrevious()}">
                                <a class="page-link"
                                    th:href="@{/links(page=${links.number - 1}, keyword=${keyword}, filter=${filter}, sort=${sort}, categoryId=${categoryId})}">
                                <
                                </a>
                            </li>
                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, links.totalPages - 1)}"
                                th:classappend="${i == links.number} ? 'active'">
                                
                                <!-- <a class="page-link"
                                    th:href="@{/links(page=${i})}"
                                    th:text="${i + 1}"></a> -->
                                <a class="page-link"
                                    th:href="@{/links(page=${i}, keyword=${keyword}, filter=${filter}, sort=${sort}, categoryId=${categoryId})}"
                                    th:text="${i + 1}"></a>
                            </li>
                            <!-- 다음 -->
                            <li class="page-item" th:if="${links.hasNext()}">
                                <a class="page-link"
                                    th:href="@{/links(page=${links.number + 1}, keyword=${keyword}, filter=${filter}, sort=${sort}, categoryId=${categoryId})}">
                                >
                                </a>
                            </li>
                            <!-- 마지막 -->
                            <li class="page-item" th:if="${!links.last}">
                                <a class="page-link"
                                    th:href="@{/links(page=${links.totalPages - 1}, keyword=${keyword}, filter=${filter}, sort=${sort}, categoryId=${categoryId})}">
                                >>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
                <!-- <div class="card-header">
                    <table border="1" class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>카테고리</th>
                                <th>썸네일</th>
                                <th>제목</th>
                                <th>URL</th>
                                <th>설명</th>
                                <th>즐겨찾기</th>
                                <th>읽은시간</th>
                                <th>삭제</th>
                                <th>등록일</th>
                                <th>수정일</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="link : ${links.content}">
                                <td th:text="${link.id}"></td>
                                <td th:text="${link.category != null ? link.category.name : '미분류'}"></td>
                                <td>
                                    <img th:if="${link.thumbnail != null and !link.thumbnail.isEmpty()}"
                                            th:src="${link.thumbnail}"
                                            width="120">
                                    <span th:if="${link.thumbnail == null or link.thumbnail.isEmpty()}">없음</span>
                                </td>
                                <td th:text="${link.title}"></td>
                                <td>
                                    <a th:href="${link.url}"
                                        target="_blank"
                                        th:text="${link.url}">
                                    </a>
                                </td>
                                <td th:text="${link.description}"></td>
                                <td>
                                    <form th:action="@{/links/{id}/favorite(id=${link.id})}" method="post">
                                        <button type="submit">
                                            <span th:if="${link.favorite}" class="badge bg-warning">★</span>
                                            <span th:unless="${link.favorite}" class="badge bg-secondary">☆</span>
                                        </button>
                                    </form>
                                </td>
                                <td>
                                    <form th:action="@{/links/{id}/read(id=${link.id})}" method="post">
                                        <button type="submit">
                                            <span th:if="${link.readAt != null}"
                                                th:text="${#temporals.format(link.readAt, 'yyyy-MM-dd HH:mm')}" class="badge bg-success">읽음</span>
                                            <span th:unless="${link.readAt != null}" class="badge bg-danger">안읽음</span>
                                        </button>
                                    </form>
                                </td>
                                <td>
                                    <form th:action="@{/links/{id}/delete(id=${link.id})}" method="post">
                                        <button type="submit">삭제</button>
                                    </form>
                                </td>
                                <td th:text="${#temporals.format(link.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                <td th:text="${#temporals.format(link.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                            </tr>
                        </tbody>
                    </table>
                    <nav class="mt-3">
                        <ul class="pagination">
                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, links.totalPages - 1)}"
                                th:classappend="${i == links.number} ? 'active'">
                                <a class="page-link"
                                    th:href="@{/links(page=${i})}"
                                    th:text="${i + 1}"></a>
                            </li>
                        </ul>
                    </nav>
                </div> -->
            </div>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>MyPage</title>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/link.js}"></script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container mt-5">
        <h2>MyPage</h2>

        <table class="table">
            <tr>
                <th>아이디</th>
                <td th:text="${user.userId}"></td>
            </tr>
            <tr>
                <th>가입일</th>
                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}"></td>
            </tr>
        </table>

        <a href="/mypage/password"
            class="btn btn-primary">비밀번호 변경</a>
        <form th:action="@{/mypage/delete}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-danger"
                    onclick="return confirm('정말 회원탈퇴 하시겠습니가?')">
                회원탈퇴
            </button>
        </form>
        <a href="/links" class="btn btn-secondary">홈</a>
    </div>
</body>
</html>

<html layout:decorate="~{layout}">
    <div layout:fragment="content">
        <script th:src="@{/js/main.js}"></script>
        <div class="container mt-3">
            <div class="mb-3">

            </div>
            <!-- 검색 엔진 버튼 -->
            <div class="mb-3">
                <button
                    type="button"
                    class="btn btn-outline-primary engine-btn activa"
                    data-engine="google">Google</button>
                <button
                    type="button"
                    class="btn btn-outline-primary engine-btn"
                    data-engine="naver">Naver</button>
                <button
                    type="button"
                    class="btn btn-outline-primary engine-btn"
                    data-engine="youtube">Youtube</button>
            </div>
            <!-- 검색 영역 -->
            <!-- 전체 선택 -->
            <div class="input-group">
                <input type="text" id="search_kw" class="form-control" placeholder="검색어를 입력하여 주세요.">
                <button class="btn btn-primary" type="button" id="btn_search">검색</button>
            </div>
            <div class="mt-3">
                <input 
                    type="checkbox"
                    id="check_all"
                    class="form-check-input">
                <label for="check_all">전체 선택</label>
            </div>
            <!-- 검색 결과 영역 -->
            <div id="result_area" class="mt-3">

            </div>
            <!-- 페이지 영역 -->
             <div id="pagination" class="mt-3 text-center">

             </div>
        </div>
    </div>
</html>

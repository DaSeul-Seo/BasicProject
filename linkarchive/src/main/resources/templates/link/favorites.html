<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <title>Link Archive</title>
        <script th:src="@{/js/bootstrap.min.js}"></script>
        <script th:src="@{/js/link.js}"></script>
        <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}">
        <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    </head>

    <body>
        <div class="container mt-5">
            <h2 class="mb-4">즐겨찾기</h2>

            <div class="card mb-4">
                <div class="mb-3">
                    <a href="/links" class="btn btn-secondary">전체</a>
                    <a th:each="category : ${categories}"
                        th:href="@{/links/category/{id}(id=${category.id})}"
                        class="btn btn-outline-primary">[[${category.name}]]</a>
                </div>
                <div class="card-header">URL 저장</div>
                <div class="card-body">
                    <form action="/links" method="post" class="row g-2">
                        <div class="col-md-7">
                            <input type="text" name="url" class="form-control" placeholder="https://">
                        </div>
                        <div class="col-md-3">
                            <select name="categoryId" class="form-select">
                                <option value="">카테고리 선택</option>
                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">저장</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- 검색 -->
            <div class="card mb-4">
                <div class="card-header">검색</div>
                <div class="card-body">
                    <form action="/links/search" method="get" class="row g-2">
                        <div class="col-md-10">
                            <input type="text" name="keyword" class="form-control" placeholder="검색어">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-success w-100">검색</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="mb-3">
                <a th:href="@{/links(sort='latest')}"
                    class="btn btn-outline-primary">최신순</a>
                <a th:href="@{/links(sort='favorite')}"
                    class="btn btn-outline-warning">즐겨찾기</a>
                <a th:href="@{/links(sort='unread')}"
                    class="btn btn-outline-danger">안읽음</a>
            </div>
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5>전체</h5>
                            <h2 th:text="${totalCount}"></h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5>즐겨찾기</h5>
                            <h2 th:text="${favoriteCount}"></h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5>읽음</h5>
                            <h2 th:text="${readCount}"></h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5>안읽음</h5>
                            <h2 th:text="${unreadCount}"></h2>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${links.isEmpty()}"
                class="alert alert-warning">
                저장된 링크가 없습니다.
            </div>
            <!-- 목록 -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">목록</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-4"
                            th:each="link : ${links.content}">
                            <div class="card h-100 shadow-sm link-card"
                                th:attr="data-url=${link.url}"
                                th:classappend="
                                    (${link.favorite} ? ' favorite-card' : '') +
                                    (${link.readAt != null} ? ' opacity-50' : '')">
                                <!-- 썸네일 -->
                                <img th:if="${link.thumbnail != null && !#strings.isEmpty(link.thumbnail)
                                            ? link.thumbnail : '/img/no-image.png'}"
                                    th:src="${link.thumbnail}"
                                    class="card-img-top"
                                    style="height: 200px; object-fit:cover;">
                                <div class="card-body">
                                    <!-- 카테고리 -->
                                    <span class="badge bg-primary mb-2"
                                        th:text="${link.category != null ? link.category.name : '미분류'}"></span>
                                    <!-- 제목 -->
                                    <h5 class="card-title"
                                        th:text="${link.title}"></h5>
                                    <!-- URL -->
                                    <p>
                                        <a th:href="${link.url}"
                                            target="_blank"
                                            class="text-decoration-none">방문하기</a>
                                    </p>
                                    <!-- 설명 -->
                                    <p class="text-muted"
                                        th:text="${link.description != null && #strings.length(link.description) > 100
                                                    ? #strings.substring(link.description, 0, 100) + '...'
                                                    : link.description}"></p>
                                    <!-- 등록일 -->
                                    <small class="text-secondary">등록일 : 
                                        <span th:text="${#temporals.format(link.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                    </small>
                                </div>
                                <div class="card-footer bg-white">
                                    <div class="d-flex justify-content-between">
                                        <!-- 즐겨찾기 -->
                                        <form th:action="@{/links/{id}/favorite(id=${link.id})}" method="post">
                                            <button class="btn btn-sm btn-outline-warning">
                                                <span th:if="${link.favorite}">★</span>
                                                <span th:unless="${link.favorite}">☆</span>
                                            </button>
                                        </form>
                                        <!-- 읽음 -->
                                        <form th:action="@{/links/{id}/read(id=${link.id})}" method="post">
                                            <button class="btn btn-sm btn-outline-success">
                                                <span th:if="${link.readAt != null}" class="badge bg-success">읽음</span>
                                                <span th:unless="${link.readAt != null}" class="badge bg-danger">안읽음</span>
                                            </button>
                                        </form>
                                        <!-- 삭제 -->
                                         <form th:action="@{/links/{id}/delete(id=${link.id})}" method="post">
                                            <button class="btn btn-sm btn-outline-danger">삭제</button>
                                         </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 페이지네이션 -->
                    <nav class="mt-4">
                        <ul class="pagination justify-content-center">
                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, links.totalPages - 1)}"
                                th:classappend="${i == links.number} ? 'active'">
                                
                                <a class="page-link"
                                    th:href="@{/links(page=${i})}"
                                    th:text="${i + 1}"></a>
                            </li>
                        </ul>
                    </nav>
                </div>

    </body>

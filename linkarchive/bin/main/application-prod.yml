spring:
    application:
        name: linkarchive

    # DATABASE
    h2:
        console:
            enabled: true                   # H2 콘솔에 접속할 것인지 (true : H2 데이터베이스를 웹 UI로 보여준다.)
            path: /h2-console               # H2 콘솔로 접속하기 위한 URL 경로
    datasource:
        url: jdbc:h2:file:./db/testdb          # 데이터베이스에 접속하기 위한 경로
        driver-class-name: org.h2.Driver    # 데이터베이스에 접속할 때 사용하는 드라이버
        username: sa                        # 데이터베이스의 사용자명(기본값 sa)
        password:                           # 데이터베이스의 비밀번호(개발용도라서 빈값)

    jpa:
        hibernate:
            ddl-auto: update

        show-sql: true

        properties:
            hibernate:
                dialect: org.hibernate.dialect.H2Dialect
                format_sql: true
    
    thymeleaf:
        cache: false